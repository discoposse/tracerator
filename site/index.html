<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracerator</title>
  <link rel="stylesheet" href="/carbon.css">
  <link rel="stylesheet" href="/css/workspace.css">
</head>
<body class="workspace-body">
  <div class="workspace-shell">
    <nav class="workspace-nav">
      <div class="nav-links">
        <a href="/" class="active">Workspace</a>
        <a href="/profiles">Profiles</a>
        <a href="/compare">Compare</a>
        <a href="/study">Study</a>
      </div>
    </nav>

    <header class="brand-hero">
      <h1 class="wordmark">Tracerator</h1>
      <p class="tagline">
        Generate Mooncake-style workloads, validate with AIPerf, inspect arrivals and prefix reuse, then narrate what the replay showed.
      </p>
      <div class="cta-row">
        <button type="button" class="btn" id="new-run-btn">New run</button>
        <button type="button" class="btn btn-ghost" id="refresh-btn">Refresh</button>
      </div>
    </header>

    <p class="section-label">Runs</p>
    <div class="flex-row" style="margin-bottom: 10px;">
      <input id="search-q" type="search" placeholder="Search runs…" style="flex:1;min-width:180px;border:1px solid var(--tr-line);padding:8px 10px;font-family:var(--font-sans);">
      <select id="status-filter" style="border:1px solid var(--tr-line);padding:8px 10px;font-family:var(--font-sans);">
        <option value="">All statuses</option>
        <option value="draft">draft</option>
        <option value="generated">generated</option>
        <option value="validated">validated</option>
        <option value="replayed">replayed</option>
      </select>
    </div>
    <div id="run-list" class="run-list" aria-live="polite">
      <div class="empty-state muted">Loading runs…</div>
    </div>
  </div>
  <script src="/js/workspace.js"></script>
</body>
</html>
